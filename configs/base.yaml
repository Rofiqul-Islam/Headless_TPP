# Defaults shared by every Headless-TPP run. Experiment configs inherit from this file
# and command-line overrides (--set key.sub=value) take precedence.
experiment: debug
variant: base
method: headless          # headless | baseline
out_dir: runs/debug

model:
  name: Qwen/Qwen2.5-1.5B   # any Hugging Face causal LM (Qwen2.5-0.5B / 1.5B / 7B, Llama, ...)
  pretrained: true          # false = same architecture with random weights (no language pre-training)
  dtype: bfloat16
  attn_implementation: sdpa # sdpa is required for TEXT-ONLY and time prediction (custom attention masks)
  gradient_checkpointing: true
  mark_init: mean           # mean = type tokens start as new IDs; name = NAMED-OUT (start from the name's embedding)
  lora: {r: 16, alpha: 32, dropout: 0.05,
         targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}

timecode:
  kind: hier                # hier = hierarchical time tokens; digits = LLMTime-style digit strings (ablation)
  branching: [8, 8, 8]      # scale -> range -> detail; 512 fine bins + exponential tail
  p_tail: 0.01              # share of training waits beyond the last finite bin
  split: quantile
  time_resolution: null     # null = take it from the dataset's meta.json (rule R3)
  digits: {n_int: 3, n_dec: 2, scale: null}

data:
  dir: data/hawkes
  condition: no_text        # no_text | names | scrambled | full | shuffled | text_only
  budget: event             # event = same number of past events in every condition; token = same number of tokens
  max_events: 64            # events per window (event budget)
  max_tokens: 2048          # tokens per window (token budget)
  ctx_frac: 0.5             # share of each window used as context only
  desc_max_tokens: 48
  silence: true             # include the final quiet gap of each sequence
  prompt: "The following is a sequence of events. Each event gives its waiting time, its type and optional text.\n"
  max_train_seqs: null
  max_val_seqs: null
  max_test_seqs: null

train:
  seed: 1
  lr: 2.0e-4                # LoRA
  lr_new: 1.0e-3            # rows of the new tokens
  weight_decay: 0.0
  warmup_frac: 0.03
  min_lr_ratio: 0.1
  clip: 1.0
  max_tokens_per_batch: 16384
  eval_tokens_per_batch: 32768
  max_batch_size: 32
  grad_accum: 1
  workers: 2
  log_every: 50
  eval_every: 500
  eval_max_batches: null
  patience: 6
  synthetic_sequences: 2000
  lambda_d: 0.0             # weight of the description loss (FULL+GEN)
  gen: false                # score/write the next description
  stages:                   # Section 3, Idea 4 (stage 4, calibration, runs after training)
    - {name: grammar, steps: 200, losses: [time, type], train: new_tokens, synthetic_frac: 0.5}
    - {name: next_event, epochs: 2, losses: [time, type, desc]}
    - {name: silence, epochs: 1, losses: [time, type, desc, sil]}

eval:
  calibrate: true
  calibrate_marks: true
  predict_depth: 3          # expand the token tree this deep for the mean/median waiting time
  predict_max_events: 3000  # number of test events with time predictions
  gen_max_events: 300
  top_p: 0.9

baseline:
  encoder: gru              # gru | transformer
  d: 64
  layers: 2
  heads: 4
  n_comp: 8
  lr: 1.0e-3
  batch_size: 64
  epochs: 100
  patience: 10
